<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Dustin Leung — Aerospace Innovation and Engineering Leadership</title>
  <desc id="description">Dustin Leung. Mechanical Design, Aerospace Innovation, and Engineering Leadership. University of Michigan DEng pathway and Oregon State University. Warm off-white and navy portfolio branding with the circular DL mark.</desc>
  <rect width="1200" height="630" fill="#f7f6f2"/>
  <circle cx="1028" cy="280" r="94" fill="#09090a" stroke="#fff" stroke-width="4"/>
  <text x="1028" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="70" font-weight="700" fill="#ffcb05">DL</text>
  <g font-family="Arial, sans-serif" fill="#00274c">
    <text x="68" y="180" font-size="80" font-weight="700" letter-spacing="-2">Dustin Leung</text>
    <rect x="72" y="212" width="80" height="5" rx="2.5" fill="#d73f09"/>
    <text x="72" y="278" font-size="29">Mechanical Design</text>
    <text x="72" y="326" font-size="29">Aerospace Innovation</text>
    <text x="72" y="374" font-size="29">Engineering Leadership</text>
    <text x="72" y="449" font-size="20" fill="#535b63">Industry experience · NASA · Boeing · PCC Structurals</text>
  </g>
  <rect y="510" width="1200" height="120" fill="#00274c"/>
  <g font-family="Arial, sans-serif" fill="#fff">
    <text x="72" y="560" font-size="24" font-weight="700">University of Michigan</text>
    <text x="72" y="595" font-size="18" fill="#ffcb05">DEng pathway · M.S. along the way</text>
    <text x="700" y="560" font-size="24" font-weight="700">Oregon State University</text>
    <text x="700" y="595" font-size="18">B.S. Mechanical Engineering · Aerospace Option</text>
  </g>
</svg>
