name: Portfolio Checks

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Standard hosted runners are free for public repositories. Do not run this
    # automatically if the repository is later made private.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check project navigation and search
        run: node tests/portfolio.test.cjs
      - name: Check related work and project contact paths
        run: node tests/related.test.cjs
      - name: Check motion controls and geometry
        run: node tests/ambient.test.cjs
      - name: Check technical figure viewer
        run: node tests/figures.test.cjs
      - name: Check portfolio link previews
        run: node tests/social.test.cjs
      - name: Check stylesheet safeguards
        run: node tests/styles.test.cjs
      - name: Check representative contrast and focus safeguards
        run: node tests/contrast.test.cjs
      - name: Check engineering data consistency
        run: node tests/engineering.test.cjs
      - name: Protect the original reports and resume
        run: node tests/documents.test.cjs
      - name: Check all site links and page metadata
        run: python3 tests/check_site.py
      - name: Prevent stale stylesheet and script versions
        run: python3 tools/version_assets.py
      - name: Check asset-version refresh behavior
        run: python3 tests/assets.test.py
